name: Build & Publish Signed Release
on:
  push:
    tags:
      - 'v*'
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout project
      uses: actions/checkout@v4
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
    - name: Make gradlew executable
      run: chmod +x ./gradlew
    - name: Decode Keystore
      run: |
        echo "${{ secrets.KEYSTORE }}" | base64 -d > app/release.jks
    - name: Build Signed Release APK
      run: ./gradlew assembleRelease
      env:
          KEYSTORE_FILE: release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    - name: Rename APK
      run: |
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/app-${{ github.ref_name }}.apk
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
          files: app/build/outputs/apk/release/app-${{ github.ref_name }}.apk
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
      env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
